<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101018">
    <title>Painel de áudios</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101018;
        color: #f5f3ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -20%, rgb(110 74 230 / 24%), transparent 55%),
          #101018;
      }

      main {
        width: min(100% - 32px, 720px);
        margin: 0 auto;
        padding: 64px 0 48px;
      }

      .heading {
        margin-bottom: 32px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #b5a5ff;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.25rem);
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .intro {
        max-width: 480px;
        margin: 14px 0 0;
        color: #aaa8b8;
        font-size: 1rem;
        line-height: 1.6;
      }

      .scenarios-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 24px;
        padding: 12px 17px;
        border: 1px solid #8c72f5;
        border-radius: 10px;
        background: #7658ed;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }

      .scenarios-link:hover {
        transform: translateY(-1px);
        background: #866cf4;
      }

      .scenarios-link:focus-visible,
      audio:focus-visible {
        outline: 3px solid #c4b8ff;
        outline-offset: 3px;
      }

      .track-list {
        display: grid;
        gap: 12px;
      }

      .track {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        align-items: center;
        gap: 16px;
        padding: 18px;
        border: 1px solid #292735;
        border-radius: 14px;
        background: rgb(27 26 37 / 88%);
      }

      .track-number {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 12px;
        background: #302a48;
        color: #c6baff;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .track-content {
        min-width: 0;
      }

      .track h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        font-weight: 650;
      }

      audio {
        display: block;
        width: 100%;
        height: 40px;
      }

      @media (max-width: 480px) {
        main {
          padding-top: 40px;
        }

        .track {
          grid-template-columns: 34px minmax(0, 1fr);
          gap: 12px;
          padding: 14px 12px;
        }

        .track-number {
          width: 34px;
          height: 34px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="heading">
        <p class="eyebrow">Painel de reprodução</p>
        <h1>Áudios e cenários</h1>
        <p class="intro">Escolha uma faixa para reproduzir ou abra os cenários no Canva.</p>
        <a class="scenarios-link" href="https://canva.link/puvo0lz7d0nnlh6" target="_blank" rel="noopener noreferrer">
          Cenários <span aria-hidden="true">↗</span>
        </a>
      </header>

      <section class="track-list" aria-label="Lista de áudios">
        <article class="track">
          <span class="track-number" aria-hidden="true">01</span>
          <div class="track-content">
            <h2>Star Wars</h2>
            <audio controls preload="metadata" aria-label="Reproduzir Star Wars">
              <source src="audios/Star%20Wars.mp3" type="audio/mpeg">

  </body>
</html>
